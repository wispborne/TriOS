schema: spec-driven

# Project context (optional)
context: |
  Tech stack: Flutter/Dart, Riverpod (state management), dart_mappable (serialization)
  Platform: Desktop-only (Windows, macOS, Linux)
  Domain: Starsector game launcher, mod manager, and toolkit
  UI: Material Design, 8dp grid alignment, WispGrid for data grids
  

rules:
  all:
    - Write in plain English. No jargon or metaphorical shorthand. State the point first, then the reason. One idea per sentence. No theatrical framing.
